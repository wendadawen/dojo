<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【论文标题】· 概览 · Dojo</title>
  <link rel="stylesheet" href="../../libs/katex.min.css">
  <script defer src="../../libs/katex.min.js"></script>
  <script defer src="../../libs/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});"></script>
  <style>
    :root { --body: Charter, Georgia, serif; --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; --mono: 'SF Mono', Menlo, monospace; --text: #24292f; --muted: #57606a; --faint: #8c959f; --bg: #fff; --soft: #f6f8fa; --border: #d8dee4; --accent: #0969da; --warn: #9a6700; }
    @media (prefers-color-scheme: dark) { :root { --text:#e6edf3; --muted:#8b949e; --faint:#6e7681; --bg:#0d1117; --soft:#161b22; --border:#30363d; --accent:#58a6ff; --warn:#d29922; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.7 var(--body); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
    nav { font: 14px/1.4 var(--ui); margin-bottom: 2.5rem; display: flex; gap: 1.25rem; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--accent); }
    header { padding-bottom: 1.75rem; border-bottom: 1px solid var(--border); }
    .eyebrow { color: var(--accent); font: 13px/1.4 var(--mono); }
    h1 { font-size: 2rem; line-height: 1.3; margin: .5rem 0 .75rem; }
    .lead { margin: 0; color: var(--muted); font-size: 1.05rem; }
    .meta { margin-top: 1rem; color: var(--faint); font: 13px/1.5 var(--mono); }
    h2 { font-size: 1.4rem; margin: 2.5rem 0 .75rem; }
    p { margin: .9rem 0; }
    a { color: var(--accent); }
    ul, ol { padding-left: 1.3rem; }
    li { margin: .5rem 0; }
    code { font: .85em/1.5 var(--mono); background: var(--soft); padding: .15em .35em; border-radius: 4px; }
    footer { margin-top: 3.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); color: var(--faint); font: 13px/1.5 var(--ui); }
    @media (max-width: 640px) { .wrap { padding-top: 2rem; } h1 { font-size: 1.7rem; } }
  </style>
</head>
<body>
  <main class="wrap">
    <nav>
      <a href="../../index.html">← 返回 Dojo</a>
      <a href="index.html">完整解析 →</a>
    </nav>
    <header>
      <span class="eyebrow">论文概览 · 【主题标签】</span>
      <h1>【论文标题】</h1>
      <p class="lead">【定位摘要：这篇论文做了什么】</p>
      <p class="meta">【论文链接】 · 作者 · 发表 · 更新于 【日期】</p>
    </header>

    <!-- @content -->
    <!-- 概览正文：研究问题、主要贡献、方法概述和关键结论；不展开公式推导。 -->

    <footer>Dojo · 概览 · 机制细节见完整解析页</footer>
  </main>
</body>
</html>
