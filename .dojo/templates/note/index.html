<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【笔记标题】 · Dojo</title>
  <link rel="stylesheet" href="../../libs/katex.min.css">
  <script defer src="../../libs/katex.min.js"></script>
  <script defer src="../../libs/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});"></script>
  <link rel="stylesheet" href="../../libs/prism-primer-light.css">
  <script defer src="../../libs/prism.min.js"></script>
  <script defer src="../../libs/prism-python.min.js"></script>
  <style>
    :root { --body: Charter, Georgia, serif; --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; --mono: 'SF Mono', Menlo, monospace; --text: #24292f; --muted: #57606a; --faint: #8c959f; --bg: #fff; --soft: #f6f8fa; --border: #d8dee4; --accent: #0969da; --warn: #9a6700; }
    @media (prefers-color-scheme: dark) { :root { --text:#e6edf3; --muted:#8b949e; --faint:#6e7681; --bg:#0d1117; --soft:#161b22; --border:#30363d; --accent:#58a6ff; --warn:#d29922; } }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.75 var(--body); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 3.5rem 1.5rem 6rem; }
    nav { font: 14px/1.4 var(--ui); margin-bottom: 3rem; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--accent); }
    header { padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
    .eyebrow { color: var(--accent); font: 13px/1.4 var(--mono); }
    h1, h2, h3 { font-family: var(--body); line-height: 1.3; }
    h1 { margin: .5rem 0 1rem; font-size: 2.35rem; }
    h2 { margin: 3rem 0 1rem; font-size: 1.6rem; }
    h3 { margin: 2rem 0 .6rem; font-size: 1.15rem; }
    .lead { margin: 0; color: var(--muted); font-size: 1.08rem; }
    .meta { margin-top: 1rem; color: var(--faint); font: 13px/1.5 var(--mono); }
    p { margin: 1.15rem 0; }
    a { color: var(--accent); }
    code { font: .84em/1.5 var(--mono); background: var(--soft); padding: .15em .35em; border-radius: 4px; }
    pre { overflow-x: auto; padding: 1rem 1.2rem; background: var(--soft); border: 1px solid var(--border); border-radius: 8px; }
    pre code { padding: 0; background: transparent; }
    blockquote { margin: 1.5rem 0; padding: .2rem 1.25rem; border-left: 3px solid var(--border); color: var(--muted); }
    ul, ol { padding-left: 1.4rem; }
    li { margin: .45rem 0; }
    table { width: 100%; border-collapse: collapse; font: 14px/1.55 var(--ui); }
    th, td { padding: .7rem .8rem; border: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { background: var(--soft); }
    footer { margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--faint); font: 13px/1.5 var(--ui); }
    @media (max-width: 640px) { body { font-size: 17px; } .wrap { padding-top: 2rem; } h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <main class="wrap">
    <nav><a href="../../index.html">← 返回 Dojo</a></nav>
    <header>
      <span class="eyebrow">学习笔记 · 【主题标签】</span>
      <h1>【笔记标题】</h1>
      <p class="lead">【一句话核心：这次弄懂了什么】</p>
      <p class="meta">更新于 【日期】 · 类型：【内容类型】</p>
    </header>

    <!-- @content -->
    <!-- 正文按速查卡组织：要点（每点讲清一件事，可带公式/代码/例子）+ 来源。保持短、可扫读、聚焦一件事。 -->

    <footer>Dojo · 学习完成后按需留档，不自动生成进度档案。</footer>
  </main>
</body>
</html>
