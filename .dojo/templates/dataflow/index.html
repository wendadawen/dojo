<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="【首页摘要：纯文本，一句话说清这页讲什么】">
  <meta name="dojo:summary" content="【首页摘要：可含 $...$ 公式；本篇的形状与超参逐条对准源码、config 与权重】">
  <meta name="dojo:type" content="dataflow">
  <meta name="dojo:topics" content="【主题，逗号分隔，取自固定大类】">
  <meta name="dojo:tag" content="数据流">
  <title>【模型名】前向数据流 · Dojo</title>
  <!-- 画布样式：节点、连线、拖拽、缩放、参数面板，全部在这里。
       旧一代数据流页用 cytoscape + dojo-dataflow.css，新页面不用它。 -->
  <link rel="stylesheet" href="../../libs/dojo-flow.css">
  <noscript><style>
    /* 无脚本时画布不可交互，把节点表与参数面板直接显示出来 */
    .flow-config[hidden] { display: block !important; }
    .flow-cfg-btn, .flow-zoom, .flow-bar { display: none; }
  </style></noscript>
</head>
<body>
<div class="flow-app" id="flow-app">
  <noscript>
    <!-- 无脚本回退：每个视图一张节点表，保证脚本失效时页面仍可读。
         结构与 build_page 生成的一致：h2 为「标签：标题」，表头为「节点 / 形状 / 参数」。 -->
    <div class="flow-fallback">
      <h2>【视图标签】：【视图标题】</h2>
      <table><tr><th>节点</th><th>形状 / 参数</th></tr>
        <tr><td>【节点名】</td><td>【形状或参数】</td></tr>
      </table>
    </div>
  </noscript>
  <nav class="flow-bar">
    <!-- 视图标签栏：每个视图一个按钮，第一个带 on 类表示默认视图 -->
    <button type="button" class="flow-tab on" data-view="【视图 id】">【视图标签】</button>
  </nav>
  <!-- 参数面板开关：label 写 config.json 之类的名字；不需要参数面板时整段删除 -->
  <button type="button" class="flow-cfg-btn" id="flow-cfg-btn"
          aria-expanded="false" aria-controls="flow-config">config.json</button>
  <div class="flow-zoom">
    <button type="button" data-act="out" title="缩小">−</button>
    <span class="flow-zoom-label" style="padding:0 6px;line-height:24px;font-size:12px;color:var(--flow-muted)">100%</span>
    <button type="button" data-act="in" title="放大">+</button>
    <button type="button" data-act="reset" title="复位">⟲</button>
  </div>
  <!-- 参数面板：按用途分组，每组一个 details。数值逐条抄自官方 config，不做加工。 -->
  <section class="flow-config" id="flow-config" hidden>
    <h2 class="cfg-title">config.json 参数</h2>
    <div class="cfg-note">【版本与来源说明，例如：transformers_version x.y · dtype bfloat16；config.json 原值，共 N 个键】</div>
    <details class="cfg-group" open><summary>【分组名】</summary>
      <table><tr><th>【键】</th><td>【值】</td></tr></table>
    </details>
  </section>
</div>

<!-- ============================================================
     视图数据

     view = { id, label, title, nodes[], edges[], groups[]?, notes[]? }
     node = { id, name, shape?, detail?, kind, drill? }
     edge = { from, to, label? }

     kind：tensor 张量（白底直角）| op 算子（浅蓝圆角）| cache 缓存（圆柱）| port 跨视图输入输出（虚线框）

     命名：name 写源码里被调用的符号，不用部署侧实现名或自造变量。
     粒度：几行无分支的模块一格；几十行或带循环/分支的单独开视图。
     连线方向由引擎自动加，不用手写；节点坐标与折点都不用写，交给 ELK。
     ============================================================ -->
<script>window.DOJO_FLOW_DATA = {"views":[【视图数组】]};</script>
<script src="../../libs/elk.bundled.js"></script>
<script src="../../libs/dojo-flow.js"></script>
<script>
(function () {
  var app = document.getElementById('flow-app');
  if (window.DojoFlow && window.DOJO_FLOW_DATA) {
    window.__flow = window.DojoFlow.mount(app, window.DOJO_FLOW_DATA);
  }
  // 参数面板开关：点按钮或按 Esc 关闭。没有参数面板时这段可删。
  var btn = document.getElementById('flow-cfg-btn');
  var panel = document.getElementById('flow-config');
  function setCfg(open) {
    if (!btn || !panel) return;
    panel.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.classList.toggle('on', open);
  }
  if (btn && panel) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      setCfg(panel.hidden);
    });
    panel.addEventListener('click', function (e) { e.stopPropagation(); });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setCfg(false);
    });
    if ((location.hash || '').replace('#', '') === 'config') setCfg(true);
  }
})();
</script>
</body>
</html>
