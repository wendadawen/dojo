<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="【首页摘要：纯文本，一句话说清这页讲什么】">
  <meta name="dojo:summary" content="【首页摘要：可含 $...$ 公式；本篇的形状与超参逐条对准源码、config 与权重】">
  <meta name="dojo:type" content="dataflow">
  <meta name="dojo:topics" content="【主题，逗号分隔，取自固定大类】">
  <meta name="dojo:tag" content="数据流">
  <title>【模型名】</title>
  <!-- 画布样式：节点、连线、拖拽、缩放、参数面板，全部在这里。
       旧一代数据流页用 cytoscape + dojo-dataflow.css，新页面不用它。 -->
  <link rel="stylesheet" href="../../libs/dojo-flow.css">
  <!-- KaTeX 同步加载：引擎画节点和说明面板时直接调用 katex.render。
       auto-render 只处理写在 HTML 里的 config.json 面板。 -->
  <link rel="stylesheet" href="../../libs/katex.min.css">
  <script src="../../libs/katex.min.js"></script>
  <script defer src="../../libs/auto-render.min.js"
    onload="var c = document.getElementById('flow-config'); if (c) renderMathInElement(c, {
      delimiters: [{left: '$', right: '$', display: false}],
      throwOnError: false
    });"></script>
  <noscript><style>
    /* 无脚本时画布不可交互，把节点表与参数面板直接显示出来 */
    .flow-config[hidden] { display: block !important; }
    .flow-config.flow-info { display: none !important; }
    .flow-cfg-btn, .flow-zoom, .flow-bar { display: none; }
  </style></noscript>
</head>
<body>
<div class="flow-app" id="flow-app">
  <h1 class="flow-title">【模型名】</h1>
  <noscript>
    <!-- 无脚本回退：每个视图一张节点表，保证脚本失效时页面仍可读。
         结构与 build_page 生成的一致：h2 为「标签：标题」，表头为「节点 / 形状 / 参数」。 -->
    <div class="flow-fallback">
      <h2>【视图标签】：【视图标题】</h2>
      <table><tr><th>节点</th><th>形状 / 参数</th></tr>
        <tr><td>【节点名】</td><td>【形状或参数】</td></tr>
      </table>
    </div>
  </noscript>
  <nav class="flow-bar">
    <!-- 视图标签栏：每个视图一个按钮，第一个带 on 类表示默认视图 -->
    <button type="button" class="flow-tab on" data-view="【视图 id】">【视图标签】</button>
  </nav>
  <div class="flow-btns">
    <!-- 说明面板开关：内容由引擎按当前视图的 info 渲染，视图没有 info 时按钮隐藏 -->
    <button type="button" class="flow-cfg-btn flow-info-btn" id="flow-info-btn"
            aria-expanded="false" aria-controls="flow-info" hidden>说明</button>
    <!-- 参数面板开关：label 写 config.json 之类的名字；不需要参数面板时整段删除 -->
    <button type="button" class="flow-cfg-btn" id="flow-cfg-btn"
            aria-expanded="false" aria-controls="flow-config">config.json</button>
  </div>
  <div class="flow-zoom">
    <button type="button" data-act="out" title="缩小">−</button>
    <span class="flow-zoom-label" style="padding:0 6px;line-height:24px;font-size:12px;color:var(--flow-muted)">100%</span>
    <button type="button" data-act="in" title="放大">+</button>
    <button type="button" data-act="reset" title="复位">⟲</button>
  </div>
  <!-- 参数面板：顶部是计划文件「前提」一节，下面按用途分组，每组一个 details，值照抄 config.json。 -->
  <section class="flow-config" id="flow-config" hidden>
    <h2 class="cfg-title">config.json 参数</h2>
    <div class="cfg-note">【前提：这页画的是哪条路径，来自计划文件的「前提」一节】</div>
    <details class="cfg-group" open><summary>【分组名】</summary>
      <table><tr><th>【键】</th><td>【值】</td></tr></table>
    </details>
  </section>
  <section class="flow-config flow-info" id="flow-info" hidden></section>
</div>

<!-- ============================================================
     视图数据

     view = { id, label, title, nodes[], edges[], groups[]?, notes[]?, info[]? }
     info = [{ title, rows: [[键, 值], ...] }]   说明面板，随视图切换
     node = { id, name, shape?, detail?, kind, drill? }
     edge = { from, to, label? }

     kind：tensor 张量（白底直角）| op 算子（浅蓝圆角）| cache 缓存（圆柱）| port 跨视图输入输出（虚线框）

     写法见 guides/model-dataflow/plan.md。
     ============================================================ -->
<script>window.DOJO_FLOW_DATA = {"views":[【视图数组】]};</script>
<script src="../../libs/elk.bundled.js"></script>
<script src="../../libs/dojo-flow.js"></script>
<script>
(function () {
  var app = document.getElementById('flow-app');
  if (window.DojoFlow && window.DOJO_FLOW_DATA) {
    window.__flow = window.DojoFlow.mount(app, window.DOJO_FLOW_DATA);
  }
  // 说明面板与参数面板占同一块位置，同一时间只开一个；再点一次按钮或按 Esc 关闭。
  var pairs = [['flow-info-btn', 'flow-info'], ['flow-cfg-btn', 'flow-config']]
    .map(function (p) { return [document.getElementById(p[0]), document.getElementById(p[1])]; })
    .filter(function (p) { return p[0] && p[1]; });
  function setPanel(target) {
    pairs.forEach(function (p) {
      var open = p[1] === target;
      p[1].hidden = !open;
      p[0].setAttribute('aria-expanded', open ? 'true' : 'false');
      p[0].classList.toggle('on', open);
    });
  }
  pairs.forEach(function (p) {
    p[0].addEventListener('click', function (e) {
      e.stopPropagation();
      setPanel(p[1].hidden ? p[1] : null);
    });
    p[1].addEventListener('click', function (e) { e.stopPropagation(); });
  });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setPanel(null);
  });
  if ((location.hash || '').replace('#', '') === 'config') {
    setPanel(document.getElementById('flow-config'));
  }
})();
</script>
</body>
</html>
