<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dojo：个人技术学习库与知识关系地图。">
  <title>Dojo</title>
  <link rel="stylesheet" href="assets/dojo-home.css">
  <link rel="stylesheet" href="libs/katex.min.css">
</head>
<body>
  <header class="site-header">
    <div class="masthead">
      <h1>Dojo</h1>
    </div>
    <a class="repo-link" href="https://github.com/wendadawen/dojo">GitHub <span aria-hidden="true">↗</span></a>
  </header>

  <main class="app-shell">
    <div id="app-status" class="app-status" role="status" hidden></div>

    <section class="toolbar" aria-label="内容工具">
      <label class="search-box">
        <span>查找</span>
        <input id="search-input" type="search" placeholder="标题、主题或关键词" autocomplete="off">
      </label>
      <label>
        <span>类型</span>
        <select id="type-filter"><option value="">全部类型</option></select>
      </label>
      <label>
        <span>主题</span>
        <select id="topic-filter"><option value="">全部主题</option></select>
      </label>
      <label>
        <span>排序</span>
        <select id="sort-order">
          <option value="newest">最新优先</option>
          <option value="oldest">最早优先</option>
          <option value="title">标题</option>
        </select>
      </label>
    </section>

    <nav class="view-tabs" aria-label="首页视图">
      <button type="button" class="view-tab is-active" data-view="library" aria-selected="true">文档索引</button>
      <button type="button" class="view-tab" data-view="map" aria-selected="false">知识地图</button>
    </nav>

    <section id="library-view" class="view-panel">
      <div class="section-heading">
        <div>
          <h2>文档索引</h2>
        </div>
        <p id="result-count"></p>
      </div>
      <div id="library-grid" class="document-grid"></div>
      <div id="empty-state" class="empty-state" hidden>
        <p>没有找到匹配内容。</p>
        <button type="button" id="clear-filters">清空筛选</button>
      </div>
    </section>

    <section id="map-view" class="view-panel" hidden>
      <div class="map-heading">
        <div>
          <h2>知识地图</h2>
        </div>
        <div class="map-heading-tools">
          <div class="graph-mode" aria-label="地图维度">
            <button type="button" class="graph-mode-button" data-graph-mode="2d" aria-pressed="false">2D</button>
            <button type="button" class="graph-mode-button is-active" data-graph-mode="3d" aria-pressed="true">3D</button>
          </div>
          <div class="graph-legend" aria-label="节点类型">
            <span><i class="legend-dot type-concept"></i>概念</span>
            <span><i class="legend-dot type-paper"></i>论文</span>
            <span><i class="legend-dot type-note"></i>笔记</span>
          </div>
        </div>
      </div>
      <div id="map-workspace" class="map-workspace">
        <div class="graph-stage">
          <div class="graph-toolbar">
            <span id="map-count"></span>
            <button type="button" id="reset-map" class="secondary-button">全图</button>
          </div>
          <div id="global-graph" class="graph-canvas" aria-label="二维知识关系图"></div>
          <div id="global-graph-3d" class="graph-canvas graph-canvas-3d" aria-label="三维知识关系图" hidden></div>
        </div>
        <aside id="map-details" class="map-details" aria-live="polite" hidden></aside>
      </div>
    </section>
  </main>

  <noscript>此首页需要 JavaScript 来加载目录与知识地图。</noscript>

  <script src="libs/cytoscape.min.js"></script>
  <script src="libs/katex.min.js"></script>
  <script src="libs/auto-render.min.js"></script>
  <script src="assets/dojo-home-model.js"></script>
  <script src="assets/dojo-graph.js"></script>
  <script src="assets/dojo-home.js"></script>
</body>
</html>
