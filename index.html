<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dojo：个人 AI 学习库与知识关系地图。">
  <title>Dojo</title>
  <link rel="stylesheet" href="assets/dojo-home.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">PERSONAL AI LEARNING LIBRARY</p>
      <h1>Dojo</h1>
      <p class="subtitle">读论文、学概念、读代码，并从页面链接中看到知识之间的关系。</p>
    </div>
    <a class="repo-link" href="https://github.com/wendadawen/dojo">GitHub</a>
  </header>

  <main class="app-shell">
    <div id="app-status" class="app-status" role="status">正在加载内容…</div>

    <section class="toolbar" aria-label="内容工具">
      <label class="search-box">
        <span>搜索</span>
        <input id="search-input" type="search" placeholder="标题、摘要、主题…" autocomplete="off">
      </label>
      <label>
        <span>类型</span>
        <select id="type-filter"><option value="">全部类型</option></select>
      </label>
      <label>
        <span>主题</span>
        <select id="topic-filter"><option value="">全部主题</option></select>
      </label>
    </section>

    <nav class="view-tabs" aria-label="首页视图">
      <button type="button" class="view-tab is-active" data-view="library" aria-selected="true">全部内容</button>
      <button type="button" class="view-tab" data-view="map" aria-selected="false">知识地图</button>
    </nav>

    <section id="library-view" class="view-panel">
      <div class="section-heading">
        <h2>全部内容</h2>
        <p id="result-count"></p>
      </div>
      <div id="library-grid" class="document-grid"></div>
      <div id="empty-state" class="empty-state" hidden>
        <p>没有找到匹配内容。</p>
        <button type="button" id="clear-filters">清空筛选</button>
      </div>
    </section>

    <section id="map-view" class="view-panel map-layout" hidden>
      <div id="global-graph" class="graph-canvas" aria-label="全局知识关系图"></div>
      <aside id="map-details" class="map-details">
        <h2>知识地图</h2>
        <p>选择节点后查看它的入链和出链。</p>
        <button type="button" id="reset-map" class="secondary-button">重置地图</button>
      </aside>
    </section>
  </main>

  <aside id="relation-panel" class="relation-panel" hidden aria-labelledby="relation-title">
    <div class="relation-header">
      <div>
        <p class="eyebrow">DIRECT LINKS</p>
        <h2 id="relation-title">页面关系</h2>
      </div>
      <div class="relation-actions">
        <a id="relation-open" href="#">打开文章</a>
        <button type="button" id="close-relation" aria-label="关闭关系面板">×</button>
      </div>
    </div>
    <div id="local-graph" class="local-graph" aria-label="当前页面的一跳关系图"></div>
    <div class="relation-columns">
      <section><h3>链接到它</h3><div id="incoming-list"></div></section>
      <section><h3>它链接到</h3><div id="outgoing-list"></div></section>
    </div>
  </aside>
  <button id="relation-backdrop" class="relation-backdrop" type="button" hidden aria-label="关闭关系面板"></button>

  <noscript>此首页需要 JavaScript 来加载目录与知识地图。</noscript>

  <script src="libs/cytoscape.min.js"></script>
  <script src="libs/dagre.min.js"></script>
  <script src="libs/cytoscape-dagre.min.js"></script>
  <script src="assets/dojo-home-model.js"></script>
  <script src="assets/dojo-graph.js"></script>
  <script src="assets/dojo-home.js"></script>
</body>
</html>
