name: Build and deploy Dojo Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check source files
        run: |
          for f in .dojo/site/*.js; do node --check "$f"; done

      - name: Self-test the check scripts
        run: |
          python3 .dojo/scripts/concept/build_page.py --selftest
          python3 .dojo/scripts/concept/check_outline.py --selftest
          python3 .dojo/scripts/concept/check_content.py --selftest
          python3 .dojo/scripts/site/check.py --selftest
          python3 .dojo/scripts/site/check_css.py --selftest

      - name: Check unused CSS
        run: python3 .dojo/scripts/site/check_css.py

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          VERSION="${GITHUB_SHA::7}"
          sed -E "s@(assets/dojo-[a-z-]+\.(js|css))@\1?v=$VERSION@g" index.html > _site/index.html
          cp .dojo/site/* _site/assets/
          rsync -a --exclude='research/' libs wiki _site/
          # ES module 里的相对 import 没法从外部注入查询串，只能在 stage 后改写，
          # 否则 3d-force-graph / three 更新后读者会一直命中旧缓存。
          find _site/libs/site -name '*.mjs' -o -name '*.js' | while IFS= read -r lib; do
            sed -E "s@(from *[\"']\./[^\"']+\.(js|mjs))([\"'])@\1?v=$VERSION\3@g" "$lib" > "$lib.tmp"
            mv "$lib.tmp" "$lib"
          done
          while IFS= read -r page; do
            sed -E "s@(libs/concept/dojo-[a-z-]+\.(js|css))@\1?v=$VERSION@g" "$page" > "$page.tmp"
            mv "$page.tmp" "$page"
          done < <(find _site/wiki -name '*.html' | sort)
          touch _site/.nojekyll

      - name: Build catalog
        run: python3 .dojo/scripts/site/build_catalog.py --output _site/catalog.json

      - name: Check staged pages
        run: |
          set -euo pipefail
          find _site -name '*.html' -print0 | sort -z | xargs -0 python3 .dojo/scripts/site/check.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
