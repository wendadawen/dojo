name: Build and deploy Dojo Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check source files
        run: |
          node --check .dojo/home/dojo-home-model.js
          node --check .dojo/home/dojo-graph.js
          node --check .dojo/home/dojo-home.js

      - name: Stage site
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp .dojo/home/* _site/assets/
          cp -R libs wiki _site/
          touch _site/.nojekyll

      - name: Build catalog
        run: python3 .dojo/scripts/build_catalog.py --root . --output _site/catalog.json

      - name: Validate staged homepage
        run: python3 .dojo/scripts/validate.py _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
