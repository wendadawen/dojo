name: Build and deploy Dojo Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check source files
        run: |
          node --check .dojo/home/dojo-home-model.js
          node --check .dojo/home/dojo-graph.js
          node --check .dojo/home/dojo-home.js

      - name: Check inline scripts
        run: python3 .dojo/scripts/check_inline_js.py wiki/*/index.html wiki/*/overview.html

      - name: Validate page templates
        run: python3 .dojo/scripts/validate.py --templates

      - name: Check overview copy consistency
        run: python3 .dojo/scripts/normalize_overview_copy.py --check

      - name: Stage site
        run: |
          mkdir -p _site/assets
          VERSION="${GITHUB_SHA::7}"
          sed -E "s@(assets/dojo-[a-z-]+\.(js|css))@\1?v=$VERSION@g" index.html > _site/index.html
          cp .dojo/home/* _site/assets/
          rsync -a --exclude='research/' libs wiki _site/
          find _site/wiki -name '*.html' | while IFS= read -r page; do
            sed -E "s@(libs/dojo-[a-z]+\.css)@\1?v=$VERSION@g" "$page" > "$page.tmp" && mv "$page.tmp" "$page"
          done
          touch _site/.nojekyll

      - name: Build catalog
        run: python3 .dojo/scripts/build_catalog.py --root . --output _site/catalog.json

      - name: Validate staged pages
        run: python3 .dojo/scripts/validate.py $(find _site -name '*.html' | sort)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
