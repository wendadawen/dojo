name: Build and deploy Dojo Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check source files
        run: |
          node --check .dojo/home/dojo-home-model.js
          node --check .dojo/home/dojo-graph.js
          node --check .dojo/home/dojo-home.js

      - name: Validate page templates
        run: python3 .dojo/scripts/ci-01-validate.py --templates

      - name: Check dataflow generator
        run: python3 .dojo/scripts/dataflow-02-build.py --selftest

      - name: Check concept generator
        run: python3 .dojo/scripts/concept-01-build.py --selftest

      - name: Check guide examples
        run: |
          for plan in guides/examples/*/research/dataflow.md; do
            page="$(dirname "$(dirname "$plan")")/index.html"
            python3 .dojo/scripts/dataflow-02-build.py "$plan"
            git diff --exit-code -- "$page" || { echo "$page 和计划文件不一致：重新生成后再提交"; exit 1; }
            python3 .dojo/scripts/ci-01-validate.py "$page"
          done
          for md in guides/examples/*/research/concept.md; do
            dir="$(dirname "$(dirname "$md")")"
            python3 .dojo/scripts/concept-01-build.py "$md"
            git diff --exit-code -- "$dir/index.html" "$dir/overview.html" || { echo "$dir 和 concept.md 不一致：重新生成后再提交"; exit 1; }
            python3 .dojo/scripts/ci-01-validate.py "$dir/index.html" "$dir/overview.html"
          done

      - name: Check overview copy consistency
        run: python3 .dojo/scripts/ci-01-validate.py --copy

      - name: Check unused CSS
        run: python3 .dojo/scripts/ci-01-validate.py --css

      - name: Stage site
        run: |
          mkdir -p _site/assets
          VERSION="${GITHUB_SHA::7}"
          sed -E "s@(assets/dojo-[a-z-]+\.(js|css))@\1?v=$VERSION@g" index.html > _site/index.html
          cp .dojo/home/* _site/assets/
          rsync -a --exclude='research/' libs wiki _site/
          find _site/wiki -name '*.html' | while IFS= read -r page; do
            sed -E "s@(libs/dojo-[a-z]+\.css)@\1?v=$VERSION@g" "$page" > "$page.tmp" && mv "$page.tmp" "$page"
          done
          touch _site/.nojekyll

      - name: Build catalog
        run: python3 .dojo/scripts/ci-01-validate.py --catalog --output _site/catalog.json

      - name: Validate staged pages
        run: python3 .dojo/scripts/ci-01-validate.py $(find _site -name '*.html' | sort)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
