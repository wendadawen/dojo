<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="奇异值分解把矩阵分解为正交基与非负奇异值，用于低秩近似、极分解和矩阵正交化。">
  <meta name="dojo:summary" content="奇异值分解把矩阵写成 $X=U\Sigma V^\top$，其中 $U,V$ 为正交矩阵，$\Sigma$ 的对角元为非负奇异值。它用于低秩近似、极分解与矩阵正交化。">
  <meta name="dojo:type" content="note">
  <meta name="dojo:topics" content="数学基础">
  <meta name="dojo:tag" content="数学与数值">
  <title>奇异值分解（SVD）· Dojo</title>
  <link rel="stylesheet" href="../../libs/katex.min.css">
  <script defer src="../../libs/katex.min.js"></script>
  <script defer src="../../libs/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });"></script>
  <!-- Prism.js 代码高亮（本地，GitHub Primer 主题 + 函数调用扩展） -->
  <link rel="stylesheet" href="../../libs/prism-primer-light.css" id="prism-light">
  <link rel="stylesheet" href="../../libs/prism-primer-dark.css" id="prism-dark" disabled>
  <script defer src="../../libs/prism.min.js"></script>
  <script defer src="../../libs/prism-python.min.js"
    onload="Prism.languages.insertBefore('python','punctuation',{method:{pattern:/(\.)\s*([A-Za-z_]\w*)\s*(?=\()/,lookbehind:!0,alias:'function'},function:{pattern:/\b([A-Za-z_]\w*)\s*(?=\()/,alias:'function'}});Prism.languages.insertBefore('python','operator',{number:/\b\d+\.?\d*\b/});document.querySelectorAll('pre code').forEach(b=>{try{Prism.highlightElement(b)}catch(e){}});"></script>
  <link rel="stylesheet" href="../../libs/dojo-note.css">
</head>
<body>

<div class="progress-bar" id="progress"></div>

<nav class="nav">
  <div class="nav-inner">
    <span class="nav-brand">奇异值分解（SVD）</span>
    <div class="nav-links">
      <a class="home-link" href="../../index.html" aria-label="返回首页" title="返回首页">⌂</a>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <span class="icon-moon">◐</span>
        <span class="icon-sun">☀</span>
      </button>
    </div>
  </div>
</nav>

<aside class="toc" id="toc">
  <div class="toc-title">目录</div>
  <ul id="tocList"></ul>
</aside>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<h1 class="title">奇异值分解（SVD）</h1>
<p class="page-lead">奇异值分解把矩阵 $X$ 分解为 $X=U\Sigma V^{\!\top}$，其中 $U,V$ 正交、$\Sigma$ 对角非负；$\Sigma$ 的对角元称为奇异值。它用于定义极分解正交因子 $W=UV^{\!\top}$、Procrustes 问题的解等。</p>
<p class="page-meta"></p>
<p class="reading-time" id="readingTime"></p>

<p>一个典型应用是 <a href="../newton-schulz/index.html">Newton-Schulz 迭代</a>：只用矩阵乘法反复迭代逼近极分解正交因子 $W=UV^{\!\top}$，而不显式算出 $U,\Sigma,V$。</p>

<script>
/* 站内文档链接与外部链接在新标签页打开 */
(function () {
  document.querySelectorAll('a[href]').forEach(function (a) {
    var href = a.getAttribute('href') || '';
    if (!href || href.charAt(0) === '#') return;
    if (/^[a-z][a-z0-9+.\-]*:/i.test(href) || /\.html?(?:[?#]|$)/i.test(href)) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
  });
})();
</script>

<button class="back-to-top" id="backToTop" aria-label="返回顶部">↑</button>

<script>
// ============ 进度条 + 返回顶部 ============
const progressBar = document.getElementById('progress');
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  const scrolled = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
  progressBar.style.width = scrolled + '%';
  backToTop.classList.toggle('visible', h.scrollTop > 400);
});
backToTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ============ 暗/亮模式切换（带 localStorage 持久化 + highlight.js 主题切换）============
const themeToggle = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('theme') ||
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.setAttribute('data-theme', savedTheme);
function syncCodeTheme(theme) {
  const light = document.getElementById('prism-light');
  const dark = document.getElementById('prism-dark');
  if (light && dark) {
    light.disabled = (theme === 'dark');
    dark.disabled = (theme !== 'dark');
  }
}
syncCodeTheme(savedTheme);
themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  syncCodeTheme(next);
});

// ============ 自动生成侧边目录 ============
const tocList = document.getElementById('tocList');
const headings = document.querySelectorAll('body > h2, body > h3');
let currentH1Li = null;
let currentSubUl = null;
headings.forEach(h => {
  if (!h.id) {
    h.id = h.textContent.trim().replace(/[\s#?？：]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
  }
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = '#' + h.id;
  a.textContent = h.textContent.replace(/^Q\d+[：:]\s*/, '').slice(0, 30);
  a.dataset.target = h.id;
  if (h.tagName === 'H3' && currentH1Li) {
    a.classList.add('sub');
    if (!currentSubUl) {
      currentSubUl = document.createElement('ul');
      currentH1Li.appendChild(currentSubUl);
    }
    li.appendChild(a);
    currentSubUl.appendChild(li);
  } else {
    currentSubUl = null;
    li.appendChild(a);
    tocList.appendChild(li);
    currentH1Li = li;
  }
});

// ============ 滚动高亮当前章节 ============
const sections = Array.from(document.querySelectorAll('body > h2, body > h3'));
function updateActiveToc() {
  let active = null;
  for (const s of sections) {
    if (s.getBoundingClientRect().top < 120) active = s.id;
  }
  document.querySelectorAll('.toc a').forEach(a => {
    a.classList.toggle('active', a.dataset.target === active);
  });
}
window.addEventListener('scroll', updateActiveToc, { passive: true });
updateActiveToc();

// ============ 阅读时间估计 ============
const bodyText = document.body.innerText || '';
const chineseChars = (bodyText.match(/[\u4e00-\u9fff]/g) || []).length;
const englishWords = (bodyText.match(/[a-zA-Z]+/g) || []).length;
// 中文 350 字/分钟，英文 200 词/分钟
const minutes = Math.max(1, Math.ceil(chineseChars / 350 + englishWords / 200));
const totalChars = chineseChars + englishWords;
document.getElementById('readingTime').textContent =
  `全文 ${totalChars.toLocaleString('zh-CN')} 字 · 约 ${minutes} 分钟阅读`;

// ============ 图片点击放大（lightbox）============
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxCaption = document.getElementById('lightboxCaption');

// 给所有文章里的 img 加可点击 class
document.querySelectorAll('body > img, p ~ img, .grid img').forEach(img => {
  if (img.id === 'lightboxImg') return;
  img.classList.add('article-image');
  img.addEventListener('click', () => {
    lightboxImg.src = img.src;
    lightboxCaption.textContent = img.alt || '';
    lightbox.classList.add('open');
  });
});

lightbox.addEventListener('click', () => {
  lightbox.classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') lightbox.classList.remove('open');
});

// ============ 代码块复制按钮 ============
document.querySelectorAll('.code-block pre').forEach(pre => {
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = '复制';
  btn.addEventListener('click', async () => {
    const code = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
    try {
      await navigator.clipboard.writeText(code);
      btn.textContent = '已复制 ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '复制';
        btn.classList.remove('copied');
      }, 1500);
    } catch (err) {
      // 降级方案
      const textarea = document.createElement('textarea');
      textarea.value = code;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      btn.textContent = '已复制 ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '复制';
        btn.classList.remove('copied');
      }, 1500);
    }
  });
  pre.parentElement.appendChild(btn);
});

// ============ 章节折叠按钮 ============
document.querySelectorAll('body > h2').forEach(h1 => {
  const btn = document.createElement('span');
  btn.className = 'collapse-btn';
  btn.textContent = '▼';
  btn.title = '折叠/展开';
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const collapsed = h1.classList.toggle('collapsed');
    let next = h1.nextElementSibling;
    while (next && next.tagName !== 'H2') {
      next.style.display = collapsed ? 'none' : '';
      next = next.nextElementSibling;
    }
  });
  h1.appendChild(btn);
});

// ============ 键盘快捷键：j/k 跳章节 ============
const h1Sections = Array.from(document.querySelectorAll('body > h2'));
document.addEventListener('keydown', (e) => {
  // 输入框聚焦时不响应
  if (e.target.matches('input, textarea')) return;

  if (e.key === 'j' || e.key === 'ArrowDown' && e.shiftKey) {
    e.preventDefault();
    let next = h1Sections.find(s => s.getBoundingClientRect().top > 120);
    if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else if (e.key === 'k' || e.key === 'ArrowUp' && e.shiftKey) {
    e.preventDefault();
    let prev = null;
    for (const s of h1Sections) {
      if (s.getBoundingClientRect().top >= 120) break;
      prev = s;
    }
    if (prev) prev.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

// ============ 平滑滚动（点击目录链接）============
document.querySelectorAll('.toc a').forEach(a => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    const target = document.getElementById(a.dataset.target);
    // scroll-margin-top 已避开顶部导航；不要再 scrollBy 偏移，否则会打断平滑滚动
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});
</script>

/* 站内文档链接与外部链接在新标签页打开 */
(function () {
  document.querySelectorAll('a[href]').forEach(function (a) {
    var href = a.getAttribute('href') || '';
    if (!href || href.charAt(0) === '#') return;
    if (/^[a-z][a-z0-9+.\-]*:/i.test(href) || /\.html?(?:[?#]|$)/i.test(href)) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
  });
})();
</script>

</body>
</html>
