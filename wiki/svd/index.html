  <h1>奇异值分解（SVD）</h1>
  <p>该概念页待生成。奇异值分解把矩阵 $X$ 分解为 $X=U\Sigma V^{\!\top}$，其中 $U,V$ 正交、$\Sigma$ 对角非负；$\Sigma$ 的对角元称为奇异值。它用于定义极分解正交因子 $W=UV^{\!\top}$、Procrustes 问题的解等。</p>
  <p>当前作为 <a href="../newton-schulz/index.html">Newton-Schulz 迭代</a>的前置概念被引用。</p>
