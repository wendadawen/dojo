<body style="background: linear-gradient(rgba(128,128,128,.05) 1px, transparent 1px), #f7f5ef; background-size: 100% 36px;">
  <h1>奇异值分解（SVD）</h1>
  <p>奇异值分解把矩阵 $X$ 分解为 $X=U\Sigma V^{\!\top}$，其中 $U,V$ 正交、$\Sigma$ 对角非负；$\Sigma$ 的对角元称为奇异值。它用于定义极分解正交因子 $W=UV^{\!\top}$、Procrustes 问题的解等。</p>
  <p>一个典型应用是 <a href="../newton-schulz/index.html">Newton-Schulz 迭代</a>：只用矩阵乘法反复迭代逼近极分解正交因子 $W=UV^{\!\top}$，而不显式算出 $U,\Sigma,V$。</p>
